<body data-page="home">

  <header id="site-header" class="site-header"></header>

  <main>
    <section id="hero" class="hero"><div class="skeleton">Loading…</div></section>
    <section id="about" class="section"></section>
    <section id="skills" class="section"></section>
    <section id="experience" class="section"></section>
    <section id="projects" class="section"></section>
    <section id="writing" class="section"></section>
    <section id="giving" class="section"></section>
    <section id="participations" class="section"></section>

    <!-- ======= Contact Section ======= -->
    <section id="contact" class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Contact</span>
            <h2 class="section-title">Get in touch</h2>
          </div>
        </div>

        <div class="contact-grid">
          <div id="contact-info" class="card contact-info"></div>

          <form class="card contact-form" id="contact-form" method="post" action="/submit-form" role="form">
            <div class="form-row">
              <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" name="name" class="form-control" id="name" autocomplete="name" required>
              </div>
              <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" class="form-control" name="email" id="email" autocomplete="email" required>
              </div>
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" class="form-control" name="subject" id="subject" required>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea class="form-control" name="message" id="message" rows="6" required></textarea>
            </div>

            <div class="loading" role="status">Sending…</div>
            <div class="error-message" role="alert"></div>
            <div class="sent-message" role="status">Your message has been sent. Thank you!</div>

            <div class="form-footer">
              <!--recaptcha widget-->
              <div class="g-recaptcha" data-sitekey="6LdHUYErAAAAADiCbCZJ4rS06iP-KNHj6PnXPxZr"></div>
              <button type="submit" name="submit" class="btn btn-primary">Send Message <i class="bi bi-send" aria-hidden="true"></i></button>
            </div>
          </form>
        </div>
      </div>
    </section><!-- End Contact Section -->

  <footer id="site-footer" class="site-footer"></footer>

  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/contact.js"></script>
